name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt coverage

      - name: Compile Python package
        run: python -m py_compile src/rog_monitor/*.py

      - name: Python unit, contract and TUI (pty) tests + coverage
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run --source=src/rog_monitor -m unittest discover -s tests -v
          python -m coverage report --sort=cover --fail-under=50

      - name: Validate device_profiles.json
        run: python -c "import json; json.load(open('src/rog_monitor/device_profiles.json')); print('device_profiles.json OK')"

      - name: JSON snapshot smoke (graceful degradation without ASUS hardware)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os, subprocess
          out = subprocess.check_output(["python", "-m", "rog_monitor", "--json"], timeout=30)
          data = json.loads(out)
          assert "power_control" in data, "missing power_control in snapshot"
          assert "version" in data, "missing version"
          print("snapshot OK — version", data["version"])
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: node --check desktop JS
        run: |
          for f in desktop/main.js desktop/preload.js desktop/renderer/*.js; do
            echo "checking $f"; node --check "$f"
          done

      - name: node:test (priv, contract, escape) + coverage
        run: node --test --experimental-test-coverage --test-coverage-lines=90 desktop/test/*.test.js

      - name: Validate i18n (base langs, no undefined data-i18n, command texts)
        run: node scripts/validate-i18n.mjs

      - name: Electron package smoke (unpacked dir, no AppImage)
        working-directory: desktop
        run: npx electron-builder --linux dir --publish never

      - name: Shell syntax (all scripts)
        run: for f in install.sh uninstall.sh scripts/*.sh desktop/start.sh; do bash -n "$f" || exit 1; done

      - name: Installer dry-run (no root)
        run: bash scripts/install-system.sh --dry-run > /dev/null

      # E2E smoke (CP-8.04): Electron real bajo xvfb, manejado por CDP. Sin hardware ASUS los
      # bloques salen "empty" (se acepta ok|empty). El script añade --no-sandbox solo si CI esta
      # definida (los runners no permiten el sandbox SUID de chrome-sandbox).
      # electron >= 42 no baja el binario en `npm ci` (sin postinstall): se descarga aqui.
      - name: Download Electron binary
        run: node desktop/node_modules/electron/install.js

      - name: E2E smoke (Electron + CDP, xvfb)
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a node scripts/e2e-smoke.mjs --out "$RUNNER_TEMP/e2e"

      - name: Upload E2E screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-screenshot
          path: ${{ runner.temp }}/e2e/e2e-smoke.png
          if-no-files-found: ignore
