<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>ROG Overlay</title>
  <style>
    /* S11b: estilo MangoHud de alto contraste. Fondo negro al 85 %, valores blanco puro en negrita,
       etiqueta de color fijo por fila (overlay-metrics.js; contraste >= 4.5:1 comprobado en test),
       esquinas cuadradas y borde mínimo. Todo escala con --scale (S/M/L/XL = 1/1.25/1.5/2).
       La ventana se ajusta a .card (overlay.js -> overlayFit), así el anclaje cae en el borde real. */
    :root {
      --scale: 1.25;
      --bg: rgba(0, 0, 0, 0.85);
      --value: #ffffff;
      --unit: #d0d0d0;
      --profile: #ffab5c;
      --warn: #f1c21b;
      --border: rgba(255, 255, 255, 0.22);
      --mono: "IBM Plex Mono", "JetBrains Mono", "DejaVu Sans Mono", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    body {
      font-family: "IBM Plex Sans", "Inter", "Noto Sans", system-ui, sans-serif;
      color: var(--value);
      text-shadow: 0 0 2px #000, 0 1px 1px #000;
    }

    .card {
      display: inline-block;
      width: max-content;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: calc(5px * var(--scale)) calc(10px * var(--scale)) calc(6px * var(--scale));
    }

    .header {
      font-size: calc(12px * var(--scale));
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--profile);
      margin-bottom: calc(2px * var(--scale));
    }

    /* una fila por componente (vertical, como MangoHud) */
    .row {
      display: flex;
      align-items: baseline;
      gap: calc(9px * var(--scale));
      line-height: 1.2;
      white-space: nowrap;
    }
    .row-label {
      width: calc(48px * var(--scale));
      flex-shrink: 0;
      font-size: calc(14px * var(--scale));
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .cell { display: inline-flex; align-items: baseline; gap: calc(2px * var(--scale)); }
    .v {
      min-width: 3ch;
      text-align: right;
      font-family: var(--mono);
      font-size: calc(22px * var(--scale));
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--value);
    }
    .cell[data-metric="gpu_freq"] .v, .cell[data-metric="fan"] .v, .cell[data-metric="ram"] .v { min-width: 4ch; }
    .u, .k {
      font-size: calc(13px * var(--scale));
      font-weight: 600;
      color: var(--unit);
    }
    .k { margin-right: calc(2px * var(--scale)); }

    #stale-mark {
      margin-top: calc(3px * var(--scale));
      font-size: calc(12px * var(--scale));
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--warn);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span id="prof">—</span></div>
    <div id="rows"></div>
  </div>

  <script src="overlay-metrics.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
